<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PlayRates - Video Game Tracker</title>
        <script>
            // Apply the stored theme before first paint, otherwise the page
            // renders in the default theme and visibly flips. Must agree with
            // ThemeContext.tsx: same key, same default, same "system" rule.
            (function () {
                try {
                    var stored = localStorage.getItem("playrates-theme");
                    var theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : stored === "system" &&
                                window.matchMedia(
                                    "(prefers-color-scheme: light)"
                                ).matches
                              ? "light"
                              : "dark";
                    document.documentElement.classList.toggle(
                        "dark",
                        theme === "dark"
                    );
                    document.documentElement.style.colorScheme = theme;
                } catch (e) {
                    document.documentElement.classList.add("dark");
                    document.documentElement.style.colorScheme = "dark";
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

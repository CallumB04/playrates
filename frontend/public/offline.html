<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark light" />
        <title>Offline / PlayRates</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <style>
            :root {
                color-scheme: dark light;
                --ground: #0f0e12;
                --ink: #f4f3f7;
                --quiet: #a9a6b4;
                --brand: #6a44f0;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --ground: #f7f6fa;
                    --ink: #17151c;
                    --quiet: #5b5866;
                    --brand: #6a44f0;
                }
            }
            body {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 24px 16px;
                box-sizing: border-box;
                background: var(--ground);
                color: var(--ink);
                font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
                text-align: center;
            }
            img {
                width: 56px;
                height: 56px;
                border-radius: 14px;
            }
            h1 {
                margin: 20px 0 8px;
                font-size: 24px;
                line-height: 1.25;
            }
            p {
                margin: 0 auto 24px;
                max-width: 32ch;
                color: var(--quiet);
            }
            a {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 44px;
                padding: 0 20px;
                border-radius: 8px;
                background: var(--brand);
                color: #fff;
                font-weight: 600;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icon-192.png" alt="" />
            <h1>You're offline</h1>
            <p>PlayRates needs a connection. Try again once you're back online.</p>
            <a href="/">Try again</a>
        </main>
    </body>
</html>

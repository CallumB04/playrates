name: CI

on:
  push:
    branches: [main, refactor, "release/**", "v*"]
  pull_request:
    branches: [main, "release/**"]

# A new push to the same branch cancels the run already in flight, so CI
# reports on the latest commit rather than queueing behind stale ones.
# Read the code, nothing more: no step here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The frontend and backend both import @playrates/shared from its
      # built output, so this has to come first.
      - name: Build shared package
        run: npm run build -w @playrates/shared

      # Production packages only: a known high or critical hole in what
      # ships fails the build. Dev tooling never reaches a visitor.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Coverage, not a bare run: the thresholds in each vitest config are what
      # stop a new helper landing without tests.
      - name: Test
        run: npm run test:coverage
        env:
          # the suite mocks Supabase and MSW intercepts every request,
          # so these only need to satisfy env parsing
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      - name: First-load JavaScript within budget
        run: npm run size -w frontend

  migrations:
    name: Migrations apply to a clean database
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Pinned, so a CLI release can't change what CI checks without a
      # commit saying so. Dependabot only bumps action versions, not this
      # input: raise it by hand from github.com/supabase/cli/releases.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Catches the class of bug that only appears against a real
      # Postgres: a missing schema qualification, a constraint that
      # rejects the seed, a trigger that cannot resolve a type.
      - name: Start local Supabase and apply migrations
        run: supabase db start

      - name: Verify the seed applies on a reset
        run: supabase db reset

      # The triggers and functions, against a real Postgres: pgTAP files in
      # supabase/tests/database, each in a transaction that rolls back.
      - name: Database tests
        run: supabase test db

      # The generated types are what the migrations make: a migration
      # without them regenerated (npm run db:types -w backend) fails here.
      - name: Generated database types match the migrations
        run: |
          supabase gen types typescript --local > /tmp/database.generated.ts
          diff -u backend/src/types/database.generated.ts /tmp/database.generated.ts
